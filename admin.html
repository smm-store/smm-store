<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة الطلبات</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 950px;
            margin: 30px auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            background-color: #28a745;
        }
        .action-btn:hover {
            background-color: #218838;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛠️ لوحة تحكم الطلبات</h2>
        <table>
            <thead>
                <tr>
                    <th>رقم الطلب</th>
                    <th>الحساب / الرابط</th>
                    <th>الخدمة</th>
                    <th>الكمية</th>
                    <th>الحالة</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="ordersTable">
                <tr>
                    <td colspan="6">جاري تحميل الطلبات...</td>
                </tr>
            </tbody>
        </table>

        <a href="index.html" class="back-link">العودة إلى صفحة المتجر الرئيسية</a>
    </div>

    <script>
        async function fetchOrders() {
            try {
                const response = await fetch('/api/admin/orders');
                const orders = await response.json();
                const tbody = document.getElementById('ordersTable');
                tbody.innerHTML = '';

                if (orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">لا توجد طلبات حتى الآن</td></tr>';
                    return;
                }

                orders.forEach(order => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${order.id}</td>
                        <td>${order.username}</td>
                        <td>${order.service}</td>
                        <td>${order.quantity}</td>
                        <td><b>${order.status}</b></td>
                        <td>
                            <button class="action-btn" onclick="updateStatus(${order.id}, '${order.status === 'مكتمل' ? 'قيد الانتظار' : 'مكتمل'}')">
                                ${order.status === 'مكتمل' ? 'إرجاع قيد الانتظار' : 'تعيين مكتمل'}
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('خطأ في جلب الطلبات:', err);
            }
        }

        async function updateStatus(id, newStatus) {
            try {
                const response = await fetch(`/api/admin/order/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                if (response.ok) {
                    fetchOrders();
                } else {
                    alert('حدث خطأ أثناء تحديث الحالة');
                }
            } catch (err) {
                alert('تعذر الاتصال بالسيرفر');
            }
        }

        fetchOrders();
        setInterval(fetchOrders, 5000);
    </script>
</body>
</html>
