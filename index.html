<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رشق السوشيال ميديا</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f9f9f9 0%, #ece9e6 100%);
            margin: 0;
            padding: 20px;
            direction: rtl;
            overflow-x: hidden;
        }

        .hero-section {
            position: relative;
            text-align: center;
            padding: 40px 20px 20px;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .floating-icons {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            height: 100px;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .icon-badge {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            animation: float 4s ease-in-out infinite;
        }

        .icon-badge svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .insta { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #df4996 45%, #a51dbf 60%, #4c58bd 90%); left: 10%; animation-delay: 0s; }
        .tiktok { background: #000000; right: 10%; animation-delay: 1s; }
        .whatsapp { background: #25d366; left: 25%; animation-delay: 2s; }
        .youtube { background: #ff0000; right: 25%; animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
        }

        .container {
            max-width: 500px;
            margin: 10px auto 40px;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
            z-index: 2;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            background-color: #f8fafc;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
            background-color: #fff;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        button:hover {
            opacity: 0.95;
        }

        .switch-text {
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            font-size: 14px;
            cursor: pointer;
        }

        .switch-text span {
            color: #3b82f6;
            font-weight: bold;
        }

        #dashboardView {
            display: none;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 15px;
            color: #334155;
        }

        .balance-badge {
            background: #22c55e;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .price-box {
            background-color: #f0fdf4;
            border: 2px dashed #bbf7d0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #166534;
            margin-bottom: 20px;
        }

        .payment-section {
            background: #fffbeb;
            border: 1px solid #fef3c7;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .payment-info {
            background-color: #fef3c7;
            border: 1px solid #fde68a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #92400e;
            display: none;
        }

        .logout-btn {
            background: #ef4444;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="floating-icons">
            <div class="icon-badge insta">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
            </div>
            <div class="icon-badge tiktok">
                <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
            </div>
            <div class="icon-badge whatsapp">
                <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
            </div>
            <div class="icon-badge youtube">
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </div>
        </div>

        <h1>أكبر منصة رشق السوشيال ميديا</h1>
        <p class="subtitle">خدمات سريعة، آمنة، وبأفضل الأسعار العالمية</p>
    </div>

    <div class="container">
        
        <!-- قسم تسجيل الدخول / إنشاء حساب -->
        <div id="authView">
            <h2 id="authTitle">تسجيل الدخول إلى حسابك</h2>
            <form id="authForm">
                <div class="form-group">
                    <label>اسم المستخدم أو البريد:</label>
                    <input type="text" id="authUsername" required placeholder="أدخل اسم المستخدم">
                </div>
                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="authPassword" required placeholder="أدخل كلمة المرور">
                </div>
                <button type="submit" id="authBtn">دخول</button>
            </form>
            <div class="switch-text" onclick="toggleAuthMode()">
                <span id="switchTextMsg">ليس لديك حساب؟ سجل حساب جديد الآن</span>
            </div>
        </div>

        <!-- لوحة التحكم الخاصة بالعميل -->
        <div id="dashboardView">
            <div class="user-header">
                <span>مرحباً، <b id="displayUser"></b></span>
                <span class="balance-badge">الرصيد: $<span id="userBalance">0.00</span></span>
            </div>

            <h2>🚀 طلبات رشق السوشيال ميديا</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label for="orderUsername">رابط الحساب أو اليوزر:</label>
                    <input type="text" id="orderUsername" required placeholder="أدخل الرابط أو اسم المستخدم">
                </div>

                <div class="form-group">
                    <label for="service">اختر الخدمة:</label>
                    <select id="service" required>
                        <option value="" disabled selected>-- اختر الخدمة المطلوبة --</option>
                        <optgroup label="تيك توك (TikTok)">
                            <option value="متابعين تيك توك" data-price="0.75">متابعين تيك توك (0.75$ لكل 1000)</option>
                            <option value="لايكات تيك توك" data-price="0.60">لايكات تيك توك (0.60$ لكل 1000)</option>
                            <option value="مشاهدات تيك توك" data-price="0.55">مشاهدات تيك توك (0.55$ لكل 1000)</option>
                        </optgroup>
                        <optgroup label="إنستغرام (Instagram)">
                            <option value="متابعين إنستغرام" data-price="0.65">متابعين إنستغرام (0.65$ لكل 1000)</option>
                            <option value="لايكات إنستغرام" data-price="0.60">لايكات إنستغرام (0.60$ لكل 1000)</option>
                        </optgroup>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">الكمية المطلوبة:</label>
                    <input type="number" id="quantity" required min="100" value="1000">
                </div>

                <div class="price-box">
                    السعر الإجمالي: <span id="totalPrice">0</span> $
                </div>

                <button type="submit">إتمام الطلب وخصم من الرصيد</button>
            </form>

            <!-- قسم شحن الرصيد وطرق الدفع -->
            <div class="payment-section">
                <h3 style="margin-top: 0; color: #b45309; font-size: 16px;">💳 شحن الرصيد في الحساب</h3>
                <p style="font-size: 13px; color: #78350f;">اختر طريقة الدفع وقم بالتحويل، ثم اضغط على زر إشعار بالتحويل:</p>
                
                <div class="form-group" style="margin-bottom: 10px;">
                    <select id="depositMethod">
                        <option value="" disabled selected>-- اختر طريقة الدفع --</option>
                        <option value="زين كاش">زين كاش (Zain Cash)</option>
                        <option value="آسيا حولة">آسيا حولة (Asia Hawala)</option>
                        <option value="ماستر كارد">ماستر كارد (Mastercard)</option>
                    </select>
                </div>

                <!-- صندوق عرض تفاصيل وأرقام التحويل -->
                <div id="depositDetailsBox" class="payment-info">
                    <p id="depositText" style="margin: 0; font-weight: bold;"></p>
                </div>

                <button type="button" onclick="alert('قم بتحويل المبلغ لطريقة الدفع المختارة ثم تواصل معنا عبر الدعم الفني لإضافته لحسابك فوراً.')" style="background: #f59e0b; font-size: 15px; padding: 10px;">إشعار بالتحويل / طلب شحن</button>
            </div>

            <button type="button" class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>

    </div>

    <script>
        let isRegisterMode = false;

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('authTitle');
            const btn = document.getElementById('authBtn');
            const switchMsg = document.getElementById('switchTextMsg');

            if (isRegisterMode) {
                title.innerText = 'إنشاء حساب جديد';
                btn.innerText = 'تسجيل';
                switchMsg.innerText = 'لديك حساب بالفعل؟ سجل دخولك هنا';
            } else {
                title.innerText = 'تسجيل الدخول إلى حسابك';
                btn.innerText = 'دخول';
                switchMsg.innerText = 'ليس لديك حساب؟ سجل حساب جديد الآن';
            }
        }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('authUsername').value;
            
            localStorage.setItem('smm_user', username);
            if (!localStorage.getItem('smm_balance')) {
                localStorage.setItem('smm_balance', '5.00');
            }

            checkLoginState();
        });

        function checkLoginState() {
            const user = localStorage.getItem('smm_user');
            if (user) {
                document.getElementById('authView').style.display = 'none';
                document.getElementById('dashboardView').style.display = 'block';
                document.getElementById('displayUser').innerText = user;
                document.getElementById('userBalance').innerText = parseFloat(localStorage.getItem('smm_balance') || '0').toFixed(2);
                calculatePrice();
            } else {
                document.getElementById('authView').style.display = 'block';
                document.getElementById('dashboardView').style.display = 'none';
            }
        }

        function logout() {
            localStorage.removeItem('smm_user');
            checkLoginState();
        }

        function calculatePrice() {
            const serviceSelect = document.getElementById('service');
            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            const pricePer1000 = parseFloat(selectedOption.getAttribute('data-price')) || 0;
            const quantity = parseFloat(document.getElementById('quantity').value) || 0;

            const total = (quantity / 1000) * pricePer1000;
            document.getElementById('totalPrice').innerText = total.toFixed(2);
        }

        // عرض تفاصيل وأرقام الدفع بناءً على اختيار العميل
        document.getElementById('depositMethod').addEventListener('change', function() {
            const method = this.value;
            const detailsBox = document.getElementById('depositDetailsBox');
            const depositText = document.getElementById('depositText');
            
            detailsBox.style.display = 'block';

            if (method === 'زين كاش') {
                depositText.innerText = 'رقم محفظة زين كاش: 07772385374';
            } else if (method === 'آسيا حولة') {
                depositText.innerText = 'رقم محفظة آسيا حولة: 07772385373';
            } else if (method === 'ماستر كارد') {
                depositText.innerText = 'رقم الماستر كارد للتحويل: 6766393869';
            }
        });

        document.getElementById('service').addEventListener('change', calculatePrice);
        document.getElementById('quantity').addEventListener('input', calculatePrice);

        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('orderUsername').value;
            const service = document.getElementById('service').value;
            const quantity = document.getElementById('quantity').value;
            const totalPrice = parseFloat(document.getElementById('totalPrice').innerText);
            const currentUser = localStorage.getItem('smm_user');

            let currentBalance = parseFloat(localStorage.getItem('smm_balance')) || 0;

            if (currentBalance < totalPrice) {
                alert('⚠️ رصيدك الحالي غير كافي لإتمام هذا الطلب! يرجى شحن رصيدك عبر وسائل الدفع.');
                return;
            }

            currentBalance -= totalPrice;
            localStorage.setItem('smm_balance', currentBalance.toFixed(2));
            document.getElementById('userBalance').innerText = currentBalance.toFixed(2);

            const fullDescription = `[مستخدم: ${currentUser}] ${service} (${quantity} قطعة) - السعر المخصوم: ${totalPrice}$`;

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: username, 
                        service: fullDescription, 
                        quantity: quantity 
                    })
                });
                if (response.ok) {
                    alert('✅ تم خصم السعر من رصيدك وإرسال طلبك بنجاح! سيتم تنفيذه قريباً.');
                    document.getElementById('orderForm').reset();
                    calculatePrice();
                } else {
                    alert('حدث خطأ أثناء إرسال الطلب للسيرفر.');
                }
            } catch (err) {
                alert('تعذر الاتصال بالسيرفر.');
            }
        });

        window.addEventListener('DOMContentLoaded', checkLoginState);
    </script>
</body>
</html>
