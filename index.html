<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر خدمات رشق السوشيال ميديا</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 طلبات رشق السوشيال ميديا</h2>
        <form id="orderForm">
            <div class="form-group">
                <label for="username">رابط الحساب أو اليوزر:</label>
                <input type="text" id="username" required placeholder="أدخل الرابط أو اسم المستخدم هنا">
            </div>

            <div class="form-group">
                <label for="service">اختر الخدمة:</label>
                <select id="service" required>
                    <option value="" disabled selected>-- اختر الخدمة المطلوبة --</option>
                    
                    <optgroup label="تيك توك (TikTok)">
                        <option value="متابعين تيك توك">متابعين تيك توك</option>
                        <option value="لايكات تيك توك">لايكات تيك توك</option>
                        <option value="مشاهدات تيك توك">مشاهدات تيك توك</option>
                        <option value="مشاهدات لايف تيك توك">مشاهدات لايف تيك توك</option>
                    </optgroup>

                    <optgroup label="إنستغرام (Instagram)">
                        <option value="متابعين إنستغرام">متابعين إنستغرام</option>
                        <option value="لايكات إنستغرام">لايكات إنستغرام</option>
                        <option value="مشاهدات إنستغرام">مشاهدات إنستغرام</option>
                        <option value="مشاهدات لايف إنستغرام">مشاهدات لايف إنستغرام</option>
                    </optgroup>

                    <optgroup label="فيسبوك (Facebook)">
                        <option value="متابعين فيسبوك">متابعين فيسبوك</option>
                        <option value="لايكات فيسبوك">لايكات فيسبوك</option>
                        <option value="مشاهدات فيسبوك">مشاهدات فيسبوك</option>
                        <option value="مشاهدات لايف فيسبوك">مشاهدات لايف فيسبوك</option>
                    </optgroup>

                    <optgroup label="يوتيوب (YouTube)">
                        <option value="اشتراكات يوتيوب">اشتراكات يوتيوب</option>
                        <option value="لايكات يوتيوب">لايكات يوتيوب</option>
                        <option value="مشاهدات يوتيوب">مشاهدات يوتيوب</option>
                    </optgroup>

                    <optgroup label="منصة كيك (Kick)">
                        <option value="مشاهدات برنامج كيك">مشاهدات برنامج كيك</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label for="quantity">الكمية المطلوبة:</label>
                <input type="text" id="quantity" required placeholder="مثال: 1000">
            </div>

            <button type="submit">إرسال الطلب الآن</button>
        </form>
    </div>

    <script>
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const service = document.getElementById('service').value;
            const quantity = document.getElementById('quantity').value;

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, service, quantity })
                });
                if (response.ok) {
                    alert('تم إرسال طلبك بنجاح! سيتم تنفيذ الطلب قريباً.');
                    document.getElementById('orderForm').reset();
                } else {
                    alert('حدث خطأ أثناء إرسال الطلب، حاول مرة أخرى.');
                }
            } catch (err) {
                alert('تعذر الاتصال بالسيرفر.');
            }
        });
    </script>
</body>
</html>
